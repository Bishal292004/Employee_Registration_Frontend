<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Login Section -->
        <div class="form-box" id="loginBox">
            <h1>Employee Login</h1>
            <p class="subtitle">Login to your employee account</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="loginEmail">Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn">Login</button>

                <p id="loginMessage" class="message"></p>

                <p class="switch-text">
                    Don't have an account?
                    <button type="button" id="showRegister" class="link-btn">
                        Register
                    </button>
                </p>
            </form>
        </div>

        <!-- Registration Section -->
        <div class="form-box hidden" id="registerBox">
            <h1>Employee Registration</h1>
            <p class="subtitle">Create your employee account</p>

            <form id="registerForm">

                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="dob">Date of Birth</label>
                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="btn">Register</button>

                <p id="registerMessage" class="message"></p>

                <p class="switch-text">
                    Already have an account?
                    <button type="button" id="showLogin" class="link-btn">
                        Login
                    </button>
                </p>

            </form>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
